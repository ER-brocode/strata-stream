<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 240px;
          background: linear-gradient(135deg, #090d16 0%, #0d1b2a 50%, #1b263b 100%);
          border-radius: 12px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          color: #ffffff;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
          border: 1px solid rgba(0, 229, 255, 0.2);
        }
        .glow {
          position: absolute;
          width: 300px;
          height: 300px;
          background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
          top: -50px;
          right: -50px;
          animation: pulse 6s ease-in-out infinite alternate;
        }
        .glow-left {
          position: absolute;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(118, 75, 162, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
          bottom: -50px;
          left: -50px;
          animation: pulse 5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
          0% { transform: scale(0.9); opacity: 0.6; }
          100% { transform: scale(1.2); opacity: 0.9; }
        }
        .title {
          font-size: 38px;
          font-weight: 800;
          letter-spacing: -0.5px;
          background: linear-gradient(90deg, #00e5ff 0%, #70a1ff 50%, #b33771 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 8px;
          z-index: 1;
        }
        .subtitle {
          font-size: 15px;
          color: #94a3b8;
          max-width: 600px;
          text-align: center;
          line-height: 1.4;
          z-index: 1;
          margin-bottom: 16px;
        }
        .badges {
          display: flex;
          gap: 10px;
          z-index: 1;
        }
        .badge {
          background: rgba(255, 255, 255, 0.08);
          padding: 5px 12px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 600;
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #38bdf8;
        }
        .badge-s3 {
          color: #4ade80;
          border-color: rgba(74, 222, 128, 0.2);
        }
        .badge-log {
          color: #fb923c;
          border-color: rgba(251, 146, 60, 0.2);
        }
      </style>
      <div class="container">
        <div class="glow"></div>
        <div class="glow-left"></div>
        <div class="title">⚡ StrataStream</div>
        <div class="subtitle">High-Throughput Tiered Message Streaming Broker with Kafka Wire Compatibility & Autonomous S3 / MinIO Tiering</div>
        <div class="badges">
          <span class="badge badge-log">Segmented Commit Log</span>
          <span class="badge">Kafka Wire Protocol</span>
          <span class="badge badge-s3">Autonomous S3 / MinIO Cold Tier</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
